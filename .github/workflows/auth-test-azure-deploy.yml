name: Envirotrax.Auth - Test - Deploy

env:
  WEBAPP_PACKAGE_PATH: 'src/Envirotrax.Auth'
  WEBAPP_PROJECT_NAME: 'Envirotrax.Auth'
  DOTNET_VERSION: '10'
  ARTIFACT_PATH: './artifacts/Envirotrax.Auth'
  IIS_SITE_PATH: 'C:\inetpub\wwwroot\Envirotrax2-Auth-Test'

on:
  push:
    branches: [ "test" ]
    paths:
      - "src/Envirotrax.Auth/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up dependency caching for faster builds
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build with dotnet
        working-directory: ${{ env.WEBAPP_PACKAGE_PATH }}
        run: dotnet build --configuration Release

      - name: dotnet publish
        working-directory: ${{ env.WEBAPP_PACKAGE_PATH }}
        run: dotnet publish -c Release -o ${{env.DOTNET_ROOT}}/${{env.WEBAPP_PROJECT_NAME}}

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/${{env.WEBAPP_PROJECT_NAME}}

  deploy:
    runs-on: [self-hosted, test]
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ${{ env.ARTIFACT_PATH }}

      - name: Take app offline
        shell: powershell
        run: New-Item -Path "${{ env.IIS_SITE_PATH }}\app_offline.htm" -ItemType File -Force

      - name: Deploy files to IIS site
        shell: powershell
        run: |
          robocopy "${{ env.ARTIFACT_PATH }}" "${{ env.IIS_SITE_PATH }}" /MIR /NP /NFL /NDL /XF app_offline.htm
          if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }

      - name: Bring app online
        shell: powershell
        run: Remove-Item -Path "${{ env.IIS_SITE_PATH }}\app_offline.htm" -Force
