<dp-loading-spinner *ngIf="isLoading"></dp-loading-spinner>

<form #detailsForm="ngForm" (ngSubmit)="save(detailsForm)" *ngIf="!isLoading">
    <vp-section header="BPAT Account Information">
        <div class="row">
            <div class="col-md-6">
                <vp-field-grid>
                    <vp-input [(ngModel)]="professional.name"
                              name="name"
                              label="Company Name"
                              labelStyle="horizontal"
                              [required]="true"
                              [maxLength]="255"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="professional.address"
                              name="address"
                              label="Address"
                              labelStyle="horizontal"
                              [maxLength]="255"
                              [form]="detailsForm" />
                </vp-field-grid>

                <div class="row">
                    <div class="col-6 mb-2">
                        <vp-input [(ngModel)]="professional.city"
                                  name="city"
                                  label="City"
                                  [maxLength]="255"
                                  [form]="detailsForm" />
                    </div>

                    <div class="col-3 mb-2">
                        <vp-input [ngModel]="professional.state?.id"
                                  (ngModelChange)="professional.state = $event ? { id: $event } : undefined"
                                  name="stateId"
                                  label="State"
                                  type="select"
                                  [options]="states"
                                  [form]="detailsForm" />
                    </div>

                    <div class="col-3 mb-2">
                        <vp-input [(ngModel)]="professional.zipCode"
                                  name="zipCode"
                                  label="ZIP"
                                  [maxLength]="25"
                                  [form]="detailsForm" />
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <vp-field-grid>
                    <vp-input [ngModel]="professional.createdTime | date:'M/d/yy h:mm a'"
                              name="createdTime"
                              label="Account Creation Date"
                              labelStyle="horizontal"
                              [readonly]="true" />

                    <vp-input [(ngModel)]="professional.companyEmail"
                              name="companyEmail"
                              type="email"
                              label="Company Email"
                              labelStyle="horizontal"
                              [maxLength]="100"
                              [form]="detailsForm" />
                </vp-field-grid>
            </div>
        </div>
    </vp-section>

    <div class="row mt-3">
        <div class="col-md-6">
            <vp-section header="Account Phone Numbers">
                <vp-field-grid>
                    <vp-input [(ngModel)]="professional.phoneNumber"
                              name="phoneNumber"
                              label="Work #"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="professional.cellPhoneNumber"
                              name="cellPhoneNumber"
                              label="Cell #"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="professional.faxNumber"
                              name="faxNumber"
                              label="Fax #"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="professional.webSiteUrl"
                              name="webSiteUrl"
                              label="Website URL"
                              labelStyle="horizontal"
                              [maxLength]="255"
                              [form]="detailsForm" />
                </vp-field-grid>
            </vp-section>
        </div>

        <!-- One vp-section per column: vp-section is height: 100%, so two stacked in one column overflow the row. -->
        <div class="col-md-3 mt-3 mt-md-0">
            <vp-section header="Account Balance">
                <!-- Read only: the balance only moves through payments and ledger entries. -->
                <vp-input [ngModel]="professional.accountBalance | currency"
                          name="accountBalance"
                          label="Balance"
                          [readonly]="true" />
            </vp-section>
        </div>

        <div class="col-md-3 mt-3 mt-md-0">
            <vp-section header="Other">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox"
                           [(ngModel)]="professional.hidePublicListing"
                           name="hidePublicListing" [id]="idPrefix + '-hide-public-listing'">
                    <label class="form-check-label" [attr.for]="idPrefix + '-hide-public-listing'">
                        Hide from Public Listing
                    </label>
                </div>
            </vp-section>
        </div>
    </div>

    <div class="mt-3">
        <vp-backflow-tester-water-suppliers [professionalId]="professionalId" />
    </div>

    <div class="mt-3">
        <vp-backflow-tester-users [professionalId]="professionalId" />
    </div>

    <div class="mt-3">
        <vp-backflow-tester-licenses [professionalId]="professionalId" />
    </div>

    <div class="mt-3">
        <vp-backflow-tester-insurances [professionalId]="professionalId" />
    </div>

    <div class="mt-3">
        <vp-backflow-tester-gauges [professionalId]="professionalId" />
    </div>

    <div class="mt-3">
        <vp-validation-summary [form]="detailsForm"
                               [validationErrors]="validationErrors" />

        <div *ngIf="isSaved" class="alert alert-success py-2">
            Backflow tester account saved.
        </div>

        <div *ngIf="saveFailed" class="alert alert-danger py-2">
            Failed to save the backflow tester account.
        </div>

        <div class="d-flex justify-content-center">
            <button type="submit" class="btn btn-primary vp-section-button" [disabled]="isSaving">
                <i class="fa-solid fa-floppy-disk me-1"></i>
                Save
            </button>
        </div>
    </div>
</form>
