<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input [(ngModel)]="user.contactName"
                      name="contactName"
                      label="Contact Name"
                      [required]="true"
                      [maxLength]="255"
                      [form]="form" />
        </div>

        <!-- The email address is the login identity, so it is only set when the account is created. -->
        <div class="mb-3" *ngIf="!isEditMode">
            <vp-input [(ngModel)]="user.emailAddress"
                      name="emailAddress"
                      type="email"
                      label="Email"
                      [required]="true"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input [(ngModel)]="user.jobTitle"
                      name="jobTitle"
                      label="Job Title"
                      [maxLength]="150"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
