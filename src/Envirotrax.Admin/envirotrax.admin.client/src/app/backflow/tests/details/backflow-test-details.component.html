<dp-loading-spinner *ngIf="isLoading || isSaving" class="vp-spinner-overlay"></dp-loading-spinner>

<div class="alert alert-success alert-dismissible d-flex align-items-center mb-3 sticky-top"
     role="alert"
     *ngIf="saveSuccessMessage">
    <i class="fa-solid fa-circle-check me-2"></i>
    {{ saveSuccessMessage }}
    <button type="button" class="btn-close" aria-label="Close" (click)="dismissSaveMessage()"></button>
</div>

<form #detailsForm="ngForm" (ngSubmit)="save()" *ngIf="!isLoading">
    <div class="row">
        <div class="col-6 col-md-3 mb-2">
            <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleIsCurrent()">
                <i class="fa-solid fa-circle me-1"
                   [class.text-success]="test.isCurrent"
                   [class.text-danger]="!test.isCurrent"></i>
                {{ test.isCurrent ? 'Is Current' : 'Not current' }}
            </button>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleOutOfService()">
                <i class="fa-solid fa-circle me-1"
                   [class.text-success]="!test.outOfService"
                   [class.text-danger]="test.outOfService"></i>
                {{ test.outOfService ? 'Out of Service' : 'In Service' }}
            </button>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleDisapproved()">
                <i class="fa-solid fa-circle me-1"
                   [class.text-success]="!test.disapproved"
                   [class.text-danger]="test.disapproved"></i>
                {{ test.disapproved ? 'Disapproved' : 'Approved' }}
            </button>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleRejected()">
                <i class="fa-solid fa-circle me-1"
                   [class.text-success]="!test.rejected"
                   [class.text-danger]="test.rejected"></i>
                {{ test.rejected ? 'Rejected' : 'Accepted' }}
            </button>
        </div>
    </div>

    <div class="row align-items-center">
        <div class="col-6 col-md-3 mb-2">
            <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleNeedsValidation()">
                <i class="fa-solid fa-circle me-1"
                   [class.text-success]="test.needsValidation"
                   [class.text-danger]="!test.needsValidation"></i>
                {{ test.needsValidation ? 'Needs Validation [On]' : 'Needs Validation [Off]' }}
            </button>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <div class="d-flex align-items-center gap-2">
                <button type="button" class="btn btn-link flex-shrink-0 p-0 text-decoration-none text-body" (click)="toggleForceRenewal()">
                    <i class="fa-solid fa-circle me-1"
                       [class.text-success]="test.forceRenewal"
                       [class.text-danger]="!test.forceRenewal"></i>
                    {{ test.forceRenewal ? 'Force Renewal [On]' : 'Force Renewal [Off]' }}
                </button>

                <vp-input *ngIf="test.forceRenewal"
                          class="flex-grow-1"
                          name="forceRenewalYears"
                          type="select"
                          [form]="detailsForm"
                          [options]="forceRenewalYearsOptions"
                          [(ngModel)]="forceRenewalYearsId"
                          (ngModelChange)="onForceRenewalYearsChange($event)" />
            </div>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <vp-input name="backflowScheduleMonth"
                      type="select"
                      label="Schedule Month"
                      [form]="detailsForm"
                      [options]="scheduleMonthOptions"
                      [(ngModel)]="scheduleMonthId"
                      (ngModelChange)="onScheduleMonthChange($event)" />
        </div>
    </div>

    <div class="row" *ngIf="approvedByText">
        <div class="col-12 mb-1">
            <span class="fw-semibold me-1">Approved By:</span>
            <span>{{ approvedByText }}</span>
        </div>
    </div>

    <div class="row" *ngIf="rejectedByText">
        <div class="col-12 mb-1">
            <span class="fw-semibold me-1">Rejected By:</span>
            <span>{{ rejectedByText }}</span>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col-6 col-md-3 mb-2">
            <dl class="mb-0">
                <dt class="col-form-label fw-normal">Submission Date</dt>
                <dd class="form-control-plaintext mb-0">{{ test.transactionDate | date:'short' }}</dd>
            </dl>
        </div>

        <div class="col-6 col-md-3 mb-2">
            <vp-input name="testDate"
                      type="datetime"
                      label="Test Date"
                      [form]="detailsForm"
                      [(ngModel)]="test.testDate" />
        </div>

        <div class="col-12 col-md-6 mb-2">
            <div class="d-flex align-items-end gap-3">
                <div class="flex-grow-1">
                    <vp-input name="expirationDate"
                              type="date"
                              label="Expiration Date"
                              [form]="detailsForm"
                              [(ngModel)]="test.expirationDate" />
                </div>

                <div class="d-flex align-items-center gap-2 py-2">
                    <button type="button" class="btn btn-link p-0 text-decoration-none text-body" (click)="toggleRenewalRequired()">
                        <i class="fa-solid fa-circle me-1"
                           [class.text-success]="test.renewalRequired"
                           [class.text-danger]="!test.renewalRequired"></i>
                        {{ test.renewalRequired ? 'Renewal Required' : 'Not Required' }}
                    </button>

                    <span class="badge" [ngClass]="expirationBadgeClass" *ngIf="test.expirationDate">
                        {{ test.expirationDate | date }}
                    </span>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <vp-backflow-test-validation-notes [test]="test" [form]="detailsForm" />
    </div>

    <div class="mt-3">
        <vp-backflow-test-transaction [test]="test" [form]="detailsForm" />
    </div>

    <div class="mt-3">
        <vp-backflow-test-water-supplier [test]="test" />
    </div>

    <div class="mt-3">
        <vp-backflow-test-bpat [test]="test" />
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <vp-backflow-test-property [test]="test"
                                       [form]="detailsForm"
                                       [stateOptions]="stateOptions"
                                       (openSite)="openSite()" />
        </div>

        <div class="col-md-6 mt-3 mt-md-0">
            <vp-backflow-test-mailing [test]="test"
                                      [form]="detailsForm"
                                      [stateOptions]="stateOptions"
                                      (openSite)="openSite()" />
        </div>
    </div>

    <div class="mt-3">
        <vp-backflow-test-assembly [test]="test"
                                   [form]="detailsForm"
                                   [visibility]="visibility"
                                   (deviceTypeChange)="onDeviceTypeChange()" />
    </div>

    <div class="text-center mt-4">
        <ul class="vp-tabs nav nav-pills d-inline-flex">
            <li class="nav-item">
                <a class="nav-link" role="button" [class.active]="selectedTab === 'results'"
                   (click)="onTabChange('results')">{{ testResultsTabTitle }}</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" role="button" [class.active]="selectedTab === 'images'"
                   (click)="onTabChange('images')">Images</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" role="button" [class.active]="selectedTab === 'logs'"
                   (click)="onTabChange('logs')">{{ recordLogTabTitle }}</a>
            </li>
        </ul>
    </div>

    <div class="mt-3" *ngIf="selectedTab === 'results'">
        <vp-backflow-test-results [test]="test"
                                  [form]="detailsForm"
                                  [idPrefix]="idPrefix"
                                  [visibility]="visibility" />

        <div class="mt-3">
            <vp-backflow-test-readings [test]="test"
                                       [form]="detailsForm"
                                       [idPrefix]="idPrefix"
                                       [visibility]="visibility" />
        </div>

        <div class="mt-3">
            <vp-backflow-test-additional-information [test]="test" [form]="detailsForm" [idPrefix]="idPrefix" />
        </div>

        <div class="mt-3">
            <vp-backflow-test-remarks [test]="test" [form]="detailsForm" />
        </div>
    </div>

    <div class="mt-3" *ngIf="selectedTab === 'images'">
        <vp-backflow-test-images [test]="test" [visibility]="visibility" />
    </div>

    <div class="mt-3" *ngIf="selectedTab === 'logs'">
        <vp-backflow-test-record-log [testId]="id" />
    </div>

    <div class="d-flex justify-content-center gap-2 mt-4">
        <button type="submit" class="btn btn-primary vp-section-button" [disabled]="isSaving">
            <i class="fa-solid fa-floppy-disk me-1"></i>
            Save
        </button>

        <button type="button" class="btn btn-primary vp-section-button" [disabled]="isSaving" (click)="saveAndClose()">
            <i class="fa-solid fa-floppy-disk me-1"></i>
            Save &amp; Close
        </button>
    </div>
</form>
