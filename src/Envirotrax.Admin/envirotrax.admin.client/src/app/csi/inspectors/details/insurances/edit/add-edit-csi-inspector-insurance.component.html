<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input [(ngModel)]="insurance.insuranceNumber"
                      name="insuranceNumber"
                      label="Policy Number"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mb-3" *ngIf="!isEditMode">
            <vp-file-upload [(ngModel)]="certificateFile"
                            name="certificateFile"
                            validationLabel="Certificate of insurance (COI)"
                            accept=".jpg, .jpeg, .gif, .png, .bmp, .pdf"
                            [required]="true"
                            [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input [(ngModel)]="insurance.expirationDate"
                      name="expirationDate"
                      type="date"
                      label="Expiration Date"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
