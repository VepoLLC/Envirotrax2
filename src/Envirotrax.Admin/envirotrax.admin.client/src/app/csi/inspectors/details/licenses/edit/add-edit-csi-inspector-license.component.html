<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input [ngModel]="license.user?.id"
                      (ngModelChange)="onUserChange($event)"
                      name="user"
                      type="select"
                      label="User"
                      [required]="true"
                      [options]="users"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input [ngModel]="license.licenseType?.id"
                      (ngModelChange)="onLicenseTypeChange($event)"
                      name="licenseType"
                      type="select"
                      label="License Type"
                      [required]="true"
                      [options]="licenseTypes"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input [(ngModel)]="license.licenseNumber"
                      name="licenseNumber"
                      label="License Number"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input [(ngModel)]="license.expirationDate"
                      name="expirationDate"
                      type="date"
                      label="Expiration Date"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
