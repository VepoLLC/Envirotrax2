<dp-loading-spinner *ngIf="isLoading"></dp-loading-spinner>

<ng-container *ngIf="!isLoading">
    <div *ngIf="user; else userNotFound">
        <vp-section header="User Account Information">
            <vp-section-actions>
                <button type="button" class="btn btn-primary btn-sm" (click)="editUser()">
                    <i class="fa-solid fa-pencil me-1"></i>
                    Edit
                </button>
            </vp-section-actions>

            <div dp-spinner-parent>
                <dp-loading-spinner *ngIf="isUserLoading"></dp-loading-spinner>

                <vp-field-grid>
                    <vp-input [ngModel]="professional.name"
                              name="companyName"
                              label="Master Account"
                              labelStyle="horizontal"
                              [readonly]="true" />

                    <vp-input [ngModel]="user.emailAddress"
                              name="emailAddress"
                              label="User ID"
                              labelStyle="horizontal"
                              [readonly]="true" />

                    <vp-input [ngModel]="user.contactName"
                              name="contactName"
                              label="Contact Name"
                              labelStyle="horizontal"
                              [readonly]="true" />

                    <vp-input [ngModel]="user.jobTitle"
                              name="jobTitle"
                              label="Title of Inspector"
                              labelStyle="horizontal"
                              [readonly]="true" />

                    <vp-input [ngModel]="user.phoneNumber"
                              name="phoneNumber"
                              label="Cell #"
                              labelStyle="horizontal"
                              [readonly]="true" />
                </vp-field-grid>
            </div>
        </vp-section>

        <div class="mt-3">
            <vp-section [header]="registrationsHeader">
                <p class="small text-muted">
                    <strong>Fee value of -1:</strong> Use Water Supplier fee.
                    <strong class="ms-2">Fee value of 0:</strong> Free submission.
                    <strong class="ms-2">Fee value of &gt;0:</strong> Overrides the Water Supplier fee and uses this fee.
                </p>

                <vp-table [columns]="registrationColumns"
                          [data]="registrations" />
            </vp-section>
        </div>

        <div class="mt-3">
            <vp-csi-inspector-licenses [professionalId]="professionalId" [userId]="userId" />
        </div>

        <div class="mt-3">
            <vp-professional-notes [professionalId]="professionalId" [professionalType]="professionalType" [userId]="userId" />
        </div>
    </div>

    <ng-template #userNotFound>
        <div class="alert alert-warning">User not found.</div>
    </ng-template>
</ng-container>
