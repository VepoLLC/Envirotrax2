<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-2">
            <vp-input [(ngModel)]="site.name"
                      name="name"
                      label="Name"
                      [required]="true"
                      [maxLength]="255"
                      [form]="form" />
        </div>

        <div class="mb-2">
            <vp-input [(ngModel)]="site.address"
                      name="address"
                      label="Address"
                      [maxLength]="255"
                      [form]="form" />
        </div>

        <div class="row">
            <div class="col-md-5 mb-2">
                <vp-input [(ngModel)]="site.city"
                          name="city"
                          label="City"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-3 mb-2">
                <vp-input [(ngModel)]="stateId"
                          name="state"
                          type="select"
                          label="State"
                          [options]="stateOptions"
                          [form]="form" />
            </div>

            <div class="col-md-4 mb-2">
                <vp-input [(ngModel)]="site.zipCode"
                          name="zipCode"
                          label="ZIP"
                          [maxLength]="50"
                          [form]="form" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.phoneNumber"
                          name="phoneNumber"
                          label="Phone Number"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.emailAddress"
                          name="emailAddress"
                          label="Email Address"
                          [maxLength]="255"
                          [form]="form" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.county"
                          name="county"
                          label="County"
                          [required]="true"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.tceqRegion"
                          name="tceqRegion"
                          label="TCEQ Region"
                          [required]="true"
                          [maxLength]="50"
                          [form]="form" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.registrationNumber"
                          name="registrationNumber"
                          label="Registration Number"
                          [required]="true"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="site.permitNumber"
                          name="permitNumber"
                          label="Permit Number"
                          [required]="true"
                          [maxLength]="50"
                          [form]="form" />
            </div>
        </div>

        <div class="mb-2">
            <vp-input [(ngModel)]="physicalTypeId"
                      name="physicalType"
                      type="select"
                      label="Waste Type"
                      [options]="physicalTypeOptions"
                      [required]="true"
                      [form]="form" />
        </div>

        <div class="mb-2">
            <vp-input [(ngModel)]="site.locationDescription"
                      name="locationDescription"
                      label="Location Description"
                      [maxLength]="255"
                      [form]="form" />
        </div>

        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="latitude"
                          name="latitude"
                          type="number"
                          label="Latitude"
                          [decimals]="6"
                          [min]="-90"
                          [max]="90"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="longitude"
                          name="longitude"
                          type="number"
                          label="Longitude"
                          [decimals]="6"
                          [min]="-180"
                          [max]="180"
                          [form]="form" />
            </div>
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
