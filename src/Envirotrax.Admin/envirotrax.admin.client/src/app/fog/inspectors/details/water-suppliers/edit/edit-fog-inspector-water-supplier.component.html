<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input [ngModel]="registration.waterSupplier?.name"
                      name="waterSupplier"
                      label="Water Supplier"
                      [readonly]="true" />
        </div>

        <div class="mb-3">
            <vp-input [(ngModel)]="registration.fogInspectorFee"
                      name="fogInspectorFee"
                      type="number"
                      [decimals]="2"
                      [min]="0"
                      label="Fee"
                      [form]="form" />
        </div>

        <p class="small text-muted">
            Leave the fee blank to use the Water Supplier fee. 0 is a free submission, and a value above 0 overrides the Water Supplier fee.
        </p>

        <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox"
                   [(ngModel)]="registration.hasFogInspection"
                   name="hasFogInspection" [id]="idPrefix + '-active'">
            <label class="form-check-label" [attr.for]="idPrefix + '-active'">
                Active
            </label>
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox"
                   [(ngModel)]="registration.isFogInspectionSuspended"
                   name="isFogInspectionSuspended" [id]="idPrefix + '-suspended'">
            <label class="form-check-label" [attr.for]="idPrefix + '-suspended'">
                Suspended
            </label>
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">Save</button>
            </div>
        </div>
    </form>
</div>
