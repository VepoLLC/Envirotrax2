<vp-section header="Generator Information">
    <vp-section-actions>
        <button type="button"
                title="Open Site"
                (click)="openSite.emit()">
            <i class="fa-solid fa-house"></i>
        </button>
    </vp-section-actions>

    <div class="row">
        <div class="col-md-6">
            <div class="mb-2">
                <vp-input name="propertyType"
                          type="select"
                          label="Property Type"
                          [form]="form"
                          [required]="true"
                          [options]="propertyTypeOptions"
                          [(ngModel)]="propertyTypeId"
                          (ngModelChange)="onPropertyTypeChange($event)" />
            </div>

            <div class="mb-2">
                <vp-input name="propertyBusinessName"
                          label="Business Name"
                          [form]="form"
                          [maxLength]="100"
                          [(ngModel)]="ticket.propertyBusinessName" />
            </div>

            <div class="row">
                <div class="col-3 mb-2">
                    <vp-input name="propertyStreetNumber"
                              label="Street #"
                              [form]="form"
                              [required]="true"
                              [maxLength]="50"
                              [(ngModel)]="ticket.propertyStreetNumber" />
                </div>

                <div class="col-6 mb-2">
                    <vp-input name="propertyStreetName"
                              label="Street Name"
                              [form]="form"
                              [required]="true"
                              [maxLength]="100"
                              [(ngModel)]="ticket.propertyStreetName" />
                </div>

                <div class="col-3 mb-2">
                    <vp-input name="propertyNumber"
                              label="#"
                              [form]="form"
                              [maxLength]="50"
                              [(ngModel)]="ticket.propertyNumber" />
                </div>
            </div>

            <div class="mb-2">
                <vp-input name="propertyCity"
                          label="City"
                          [form]="form"
                          [required]="true"
                          [maxLength]="50"
                          [(ngModel)]="ticket.propertyCity" />
            </div>

            <div class="row">
                <div class="col-6 mb-2">
                    <vp-input name="propertyState"
                              type="select"
                              label="State"
                              [form]="form"
                              [options]="stateOptions"
                              [(ngModel)]="propertyStateId"
                              (ngModelChange)="onPropertyStateChange($event)" />
                </div>

                <div class="col-6 mb-2">
                    <vp-input name="propertyZip"
                              label="ZIP"
                              [form]="form"
                              [required]="true"
                              [maxLength]="50"
                              [(ngModel)]="ticket.propertyZip" />
                </div>
            </div>

            <div class="mb-2">
                <vp-input name="fogGeneratorPhoneNumber"
                          label="Phone Number"
                          [form]="form"
                          [maxLength]="50"
                          [(ngModel)]="ticket.fogGeneratorPhoneNumber" />
            </div>

            <div class="mb-2">
                <vp-input name="fogGeneratorEmailAddress"
                          label="Email Address"
                          [form]="form"
                          [maxLength]="50"
                          [(ngModel)]="ticket.fogGeneratorEmailAddress" />
            </div>
        </div>

        <div class="col-md-6">
            <div class="mb-2">
                <vp-input name="interceptorType"
                          type="select"
                          label="Waste Trap or Tank Type"
                          [form]="form"
                          [required]="true"
                          [options]="interceptorTypeOptions"
                          [(ngModel)]="ticket.interceptorType"
                          (ngModelChange)="onInterceptorTypeChange()" />
            </div>

            <div class="mb-2" *ngIf="isOtherInterceptorType">
                <vp-input name="interceptorOtherDescription"
                          label="Other Description"
                          [form]="form"
                          [required]="true"
                          [maxLength]="100"
                          [(ngModel)]="ticket.interceptorOtherDescription" />
            </div>

            <div class="row">
                <div class="col-7 mb-2">
                    <vp-input name="interceptorCapacity"
                              type="number"
                              label="Waste Trap or Tank Capacity"
                              [form]="form"
                              [min]="0"
                              [(ngModel)]="ticket.interceptorCapacity" />
                </div>

                <div class="col-5 mb-2">
                    <vp-input name="interceptorCapacityType"
                              type="select"
                              label="Capacity Type"
                              [form]="form"
                              [options]="capacityTypeOptions"
                              [(ngModel)]="ticket.interceptorCapacityType" />
                </div>
            </div>

            <div class="row">
                <div class="col-7 mb-2">
                    <vp-input name="interceptorWasteRemovedAmount"
                              type="number"
                              label="Amount of Waste Removed"
                              [form]="form"
                              [required]="true"
                              [min]="0"
                              [(ngModel)]="ticket.interceptorWasteRemovedAmount" />
                </div>

                <div class="col-5 mb-2">
                    <vp-input name="interceptorWasteRemovedType"
                              type="select"
                              label="Removed Type"
                              [form]="form"
                              [options]="capacityTypeOptions"
                              [(ngModel)]="ticket.interceptorWasteRemovedType" />
                </div>
            </div>

            <div class="mb-2">
                <vp-input name="interceptorWasteRemovedDate"
                          type="datetime"
                          label="Waste Removed Date"
                          [form]="form"
                          [required]="true"
                          [(ngModel)]="ticket.interceptorWasteRemovedDate" />
            </div>
        </div>
    </div>

    <div class="row mt-2">
        <div class="col-md-6 mb-2">
            <vp-input name="generatorContactName"
                      label="Generator Contact Name"
                      [form]="form"
                      [maxLength]="255"
                      [(ngModel)]="ticket.generatorContactName" />
        </div>

        <div class="col-md-6 mb-2">
            <vp-fog-trip-ticket-signature label="Generator Signature" [url]="ticket.generatorSignatureUrl" />
        </div>
    </div>
</vp-section>
