<div class="row g-3">
    <div class="col-5">
        <vp-section header="Envirotrax License Information" [collapsible]="false">
            <div class="mb-2">
                <vp-input [ngModel]="license.contactName"
                          label="Contact Name"
                          [readonly]="true" />
            </div>

            <div class="mb-2">
                <vp-input [ngModel]="license.licenseNumber"
                          label="License Number"
                          [readonly]="true" />
            </div>

            <div class="mb-2">
                <vp-input [(ngModel)]="license.expirationDate"
                          type="date"
                          label="Expiration Date" />
            </div>
        </vp-section>
    </div>

    <div class="col-2 d-flex align-items-end justify-content-center pb-3">
        <button type="button"
                class="btn btn-primary"
                title="Copy TCEQ Expiration Date"
                aria-label="Copy TCEQ Expiration Date"
                (click)="copyExpirationDate()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    <div class="col-5">
        <vp-section header="TCEQ License Information" [collapsible]="false">
            <div class="mb-2">
                <vp-input [ngModel]="tceqLicense.name"
                          label="Contact Name"
                          [readonly]="true" />
            </div>

            <div class="mb-2">
                <vp-input [ngModel]="tceqLicense.licenseNumber"
                          label="License Number"
                          [readonly]="true" />
            </div>

            <div class="mb-2">
                <label class="col-form-label">Expiration Date</label>

                <div class="border border-3 rounded"
                     [class]="tceqExpirationBorderClass">
                    <vp-input [ngModel]="tceqLicense.expirationDate"
                              type="date"
                              [readonly]="true" />
                </div>
            </div>
        </vp-section>
    </div>
</div>

<div class="d-flex justify-content-end gap-2 mt-3">
    <button *ngIf="isTceqDateNewer"
            type="button"
            class="btn btn-primary"
            (click)="updateAndSave()">
        Update &amp; Save
    </button>

    <button type="button"
            class="btn btn-primary"
            (click)="cancel()">
        Cancel
    </button>
</div>
