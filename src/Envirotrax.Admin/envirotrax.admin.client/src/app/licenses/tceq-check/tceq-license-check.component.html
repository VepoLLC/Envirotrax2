<div class="row g-3">
    <div class="col">
        <vp-section header="Envirotrax License Information" [collapsible]="false">
            <div class="d-flex flex-column justify-content-end h-100">
                <div class="mb-2">
                    <vp-input [ngModel]="license.contactName"
                              label="Contact Name"
                              [readonly]="true" />
                </div>

                <div class="mb-2">
                    <vp-input [ngModel]="license.licenseNumber"
                              label="License Number"
                              [readonly]="true" />
                </div>

                <div class="mb-2">
                    <label for="tceq-check-envirotrax-expiration" class="col-form-label">Expiration Date</label>

                    <div class="border border-3 border-white rounded">
                        <vp-input [(ngModel)]="license.expirationDate"
                                  [id]="'tceq-check-envirotrax-expiration'"
                                  type="date" />
                    </div>
                </div>
            </div>
        </vp-section>
    </div>

    <div class="col-auto d-flex align-items-end pb-3">
        <button type="button"
                class="btn btn-primary"
                title="Copy TCEQ Expiration Date"
                aria-label="Copy TCEQ Expiration Date"
                (click)="copyExpirationDate()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
    </div>

    <div class="col">
        <vp-section header="TCEQ License Information" [collapsible]="false">
            <div class="d-flex flex-column justify-content-end h-100">
                <div class="mb-2">
                    <vp-input [ngModel]="tceqLicense.name"
                              label="Contact Name"
                              [readonly]="true" />
                </div>

                <div class="mb-2">
                    <vp-input [ngModel]="tceqLicense.licenseNumber"
                              label="License Number"
                              [readonly]="true" />
                </div>

                <div class="mb-2">
                    <label for="tceq-check-tceq-expiration" class="col-form-label">Expiration Date</label>

                    <div class="border border-3 rounded"
                         [class]="tceqExpirationBorderClass">
                        <vp-input [ngModel]="tceqLicense.expirationDate"
                                  [id]="'tceq-check-tceq-expiration'"
                                  type="date"
                                  [readonly]="true" />
                    </div>
                </div>
            </div>
        </vp-section>
    </div>
</div>

<div class="d-flex justify-content-end gap-2 mt-3">
    <button *ngIf="isTceqDateNewer"
            type="button"
            class="btn btn-primary"
            (click)="updateAndSave()">
        Update &amp; Save
    </button>

    <button type="button"
            class="btn btn-primary"
            (click)="cancel()">
        Cancel
    </button>
</div>
