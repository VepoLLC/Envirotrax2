<dp-loading-spinner *ngIf="isLoading || isSaving"></dp-loading-spinner>

<form #detailsForm="ngForm" (ngSubmit)="save(detailsForm)" *ngIf="!isLoading">
    <!-- The two sections sit side by side when the window has room for both, and one above the other in a half-width
         window (a details window opens beside its search window), where the labels beside the fields wouldn't fit.
         Bootstrap's col-* classes follow the screen width, not the window's, so they can't do this. -->
    <div class="d-flex flex-wrap gap-3">
        <div class="company-details-column">
            <vp-section header="Contact Information">
                <vp-field-grid>
                    <vp-input [(ngModel)]="company.name"
                              name="name"
                              label="Name"
                              labelStyle="horizontal"
                              [required]="true"
                              [maxLength]="100"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.position"
                              name="position"
                              label="Position"
                              labelStyle="horizontal"
                              [maxLength]="100"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.contactName"
                              name="contactName"
                              label="Contact Name"
                              labelStyle="horizontal"
                              [maxLength]="100"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.address"
                              name="address"
                              label="Address"
                              labelStyle="horizontal"
                              [maxLength]="100"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.city"
                              name="city"
                              label="City"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="stateId"
                              (ngModelChange)="onStateChange($event)"
                              name="stateId"
                              label="State"
                              labelStyle="horizontal"
                              type="select"
                              [options]="states"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.zipCode"
                              name="zipCode"
                              label="ZIP"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <!-- A text field, not type="email": V1 keeps any text here, and about a quarter of its companies hold
                         a water supplier login (MUD1) that the email check would refuse, so they could not be saved. -->
                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-email-address'">Email Address</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-2">
                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="company.emailAddress"
                                              name="emailAddress"
                                              [id]="idPrefix + '-email-address'"
                                              validationLabel="Email Address"
                                              [maxLength]="100"
                                              [form]="detailsForm" />
                                </div>

                                <button type="button" class="btn btn-primary text-nowrap"
                                        [disabled]="!company.emailAddress"
                                        (click)="sendEmail()">
                                    <i class="fa-solid fa-envelope me-1"></i>
                                    Send Email
                                </button>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-input [(ngModel)]="company.phoneNumber"
                              name="phoneNumber"
                              label="Phone Number"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.cellNumber"
                              name="cellNumber"
                              label="Cell Number"
                              labelStyle="horizontal"
                              [maxLength]="50"
                              [form]="detailsForm" />
                </vp-field-grid>
            </vp-section>
        </div>

        <div class="company-details-column">
            <vp-section header="Contact Settings">
                <vp-field-grid>
                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-contact-type'">
                                Contact Type
                                <span class="text-danger">*</span>
                            </label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-2">
                                <i class="fa-solid fa-user fa-lg" [class]="contactTypeIconClass"></i>

                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="contactTypeId"
                                              (ngModelChange)="onContactTypeChange($event)"
                                              name="contactType"
                                              [id]="idPrefix + '-contact-type'"
                                              validationLabel="Contact Type"
                                              type="select"
                                              [required]="true"
                                              [options]="contactTypeOptions"
                                              [form]="detailsForm" />
                                </div>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-has-backflow-testing'">Backflow Program</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="checkbox"
                                       [(ngModel)]="company.hasBackflowTesting"
                                       name="hasBackflowTesting" [id]="idPrefix + '-has-backflow-testing'">

                                <label class="col-form-label text-nowrap" [attr.for]="idPrefix + '-backflow-testing-start-date'">Start Date</label>

                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="company.backflowTestingStartDate"
                                              name="backflowTestingStartDate"
                                              type="date"
                                              [id]="idPrefix + '-backflow-testing-start-date'"
                                              validationLabel="Backflow Program Start Date"
                                              [form]="detailsForm" />
                                </div>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-has-csi-inspection'">CSI Program</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="checkbox"
                                       [(ngModel)]="company.hasCsiInspection"
                                       name="hasCsiInspection" [id]="idPrefix + '-has-csi-inspection'">

                                <label class="col-form-label text-nowrap" [attr.for]="idPrefix + '-csi-inspection-start-date'">Start Date</label>

                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="company.csiInspectionStartDate"
                                              name="csiInspectionStartDate"
                                              type="date"
                                              [id]="idPrefix + '-csi-inspection-start-date'"
                                              validationLabel="CSI Program Start Date"
                                              [form]="detailsForm" />
                                </div>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-has-fog-inspection'">FOG Program</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="checkbox"
                                       [(ngModel)]="company.hasFogInspection"
                                       name="hasFogInspection" [id]="idPrefix + '-has-fog-inspection'">

                                <label class="col-form-label text-nowrap" [attr.for]="idPrefix + '-fog-inspection-start-date'">Start Date</label>

                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="company.fogInspectionStartDate"
                                              name="fogInspectionStartDate"
                                              type="date"
                                              [id]="idPrefix + '-fog-inspection-start-date'"
                                              validationLabel="FOG Program Start Date"
                                              [form]="detailsForm" />
                                </div>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-has-fog-transportation'">FOG Transportation Program</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-3">
                                <input class="form-check-input mt-0" type="checkbox"
                                       [(ngModel)]="company.hasFogTransportation"
                                       name="hasFogTransportation" [id]="idPrefix + '-has-fog-transportation'">

                                <label class="col-form-label text-nowrap" [attr.for]="idPrefix + '-fog-transportation-start-date'">Start Date</label>

                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="company.fogTransportationStartDate"
                                              name="fogTransportationStartDate"
                                              type="date"
                                              [id]="idPrefix + '-fog-transportation-start-date'"
                                              validationLabel="FOG Transportation Program Start Date"
                                              [form]="detailsForm" />
                                </div>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-last-contacted-by'">Last Contacted By</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-2">
                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="lastContactedById"
                                              (ngModelChange)="onLastContactedByChange($event)"
                                              name="lastContactedById"
                                              [id]="idPrefix + '-last-contacted-by'"
                                              validationLabel="Last Contacted By"
                                              type="select"
                                              [options]="users"
                                              [form]="detailsForm" />
                                </div>

                                <button type="button" class="btn btn-primary text-nowrap" (click)="setLastContactedByToMe()">
                                    Set to Me
                                </button>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>

                    <vp-input [(ngModel)]="company.lastContactDate"
                              name="lastContactDate"
                              type="date"
                              label="Last Contact Date"
                              labelStyle="horizontal"
                              [form]="detailsForm" />

                    <vp-input [(ngModel)]="company.nextContactDate"
                              name="nextContactDate"
                              type="date"
                              label="Next Contact Date"
                              labelStyle="horizontal"
                              [form]="detailsForm" />

                    <vp-field-grid-row>
                        <vp-field-grid-label>
                            <label class="col-form-label" [attr.for]="idPrefix + '-next-contact-interval'">Set Next Date</label>
                        </vp-field-grid-label>
                        <vp-field-grid-control>
                            <div class="d-flex align-items-center gap-2">
                                <div class="flex-fill">
                                    <vp-input [(ngModel)]="nextContactInterval"
                                              name="nextContactInterval"
                                              [id]="idPrefix + '-next-contact-interval'"
                                              type="select"
                                              [options]="nextContactIntervalOptions" />
                                </div>

                                <button type="button" class="btn btn-primary"
                                        [disabled]="!nextContactInterval"
                                        (click)="setNextContactDate()">
                                    Set
                                </button>
                            </div>
                        </vp-field-grid-control>
                    </vp-field-grid-row>
                </vp-field-grid>
            </vp-section>
        </div>
    </div>

    <div class="mt-3">
        <vp-validation-summary [form]="detailsForm"
                               [validationErrors]="validationErrors" />

        <div *ngIf="isSaved" class="alert alert-success py-2">
            Company saved.
        </div>

        <div class="d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-primary vp-section-button" [disabled]="isSaving">
                <i class="fa-solid fa-floppy-disk me-1"></i>
                Save
            </button>

            <button *ngIf="company.id" type="button" class="btn btn-primary vp-section-button" [disabled]="isSaving" (click)="deleteCompany()">
                <i class="fa-solid fa-trash me-1"></i>
                Delete
            </button>

            <button type="button" class="btn btn-primary vp-section-button" (click)="close()">
                <i class="fa-solid fa-xmark me-1"></i>
                Close
            </button>
        </div>
    </div>
</form>
