<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <!-- V1 requires none of these: some of its contacts have only a position, a phone number or an email address. -->
    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="contact.position"
                          name="position"
                          label="Position"
                          [maxLength]="100"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="contact.contactName"
                          name="contactName"
                          label="Contact Name"
                          [maxLength]="100"
                          [form]="form" />
            </div>
        </div>

        <div class="mb-2">
            <vp-input [(ngModel)]="contact.address"
                      name="address"
                      label="Address"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="row">
            <div class="col-md-5 mb-2">
                <vp-input [(ngModel)]="contact.city"
                          name="city"
                          label="City"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-3 mb-2">
                <vp-input [(ngModel)]="stateId"
                          (ngModelChange)="onStateChange($event)"
                          name="stateId"
                          type="select"
                          label="State"
                          [options]="states"
                          [form]="form" />
            </div>

            <div class="col-md-4 mb-2">
                <vp-input [(ngModel)]="contact.zipCode"
                          name="zipCode"
                          label="ZIP"
                          [maxLength]="50"
                          [form]="form" />
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="contact.phoneNumber"
                          name="phoneNumber"
                          label="Phone Number"
                          [maxLength]="50"
                          [form]="form" />
            </div>

            <div class="col-md-6 mb-2">
                <vp-input [(ngModel)]="contact.cellNumber"
                          name="cellNumber"
                          label="Cell Number"
                          [maxLength]="50"
                          [form]="form" />
            </div>
        </div>

        <div class="mb-2">
            <vp-input [(ngModel)]="contact.emailAddress"
                      name="emailAddress"
                      type="email"
                      label="Email Address"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100" [disabled]="isLoading">Save</button>
            </div>
        </div>
    </form>
</div>
