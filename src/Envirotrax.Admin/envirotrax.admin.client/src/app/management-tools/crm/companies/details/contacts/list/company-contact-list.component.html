<vp-section [header]="'Additional Contacts (' + (table.items?.pageInfo?.totalItems ?? 0) + ')'">
    <div dp-spinner-parent>
        <dp-loading-spinner *ngIf="table.isLoading"></dp-loading-spinner>

        <vp-table *ngIf="table.items"
                  [columns]="table.columns!"
                  [data]="table.items.data"
                  [showActionLabels]="false"
                  [canAdd]="true"
                  (add)="addContact()"
                  [canEdit]="true"
                  (edit)="editContact($event)"
                  [canDelete]="true"
                  (delete)="deleteContact($event)"
                  [(pageInfo)]="table.items.pageInfo"
                  (pageInfoChange)="getContacts()"
                  [(query)]="table.query"
                  (queryChange)="getContacts()"
                  (queryReset)="getContacts()" />
    </div>
</vp-section>
