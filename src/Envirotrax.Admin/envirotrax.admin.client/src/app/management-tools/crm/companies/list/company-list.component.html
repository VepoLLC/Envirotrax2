<ul class="vp-tabs nav nav-pills d-inline-flex flex-wrap justify-content-center mb-3">
    <li class="nav-item">
        <a class="nav-link" role="button"
           [class.active]="activeTab === 'calendar'"
           (click)="setActiveTab('calendar')">Contact Calendar</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" role="button"
           [class.active]="activeTab === 'search'"
           (click)="setActiveTab('search')">Search Contacts</a>
    </li>
</ul>

<dp-loading-spinner *ngIf="table.isLoading || calendarTable.isLoading || isDeleting"></dp-loading-spinner>

<!-- The tabs are hidden rather than removed, so each keeps its month or its search while the other one is open. -->
<div [hidden]="activeTab !== 'calendar'">
    <!-- FullCalendar is only needed in this window, so it loads with the window instead of with the Admin app. -->
    @defer {
        <vp-company-calendar [companies]="calendarTable.items?.data"
                             (rangeChange)="onCalendarRangeChange($event)"
                             (companySelect)="viewCompany($event)" />
    } @loading (after 100ms; minimum 300ms) {
        <dp-loading-spinner></dp-loading-spinner>
    }

    <div *ngIf="calendarTable.items" class="mt-3">
        <vp-section [header]="'Companies (' + (calendarTable.items.pageInfo.totalItems ?? 0) + ')'">
            <vp-table [columns]="calendarTable.columns!"
                      [data]="calendarTable.items.data"
                      [showActionLabels]="false"
                      [canAdd]="true"
                      (add)="addCompany()"
                      [canViewDetails]="true"
                      (viewDetails)="viewCompany($event)"
                      [canDelete]="true"
                      (delete)="deleteCompany($event)"
                      [(query)]="calendarTable.query"
                      (queryChange)="getCalendarCompanies()" />
        </vp-section>
    </div>
</div>

<div [hidden]="activeTab !== 'search' || showResults">
    <form #searchForm="ngForm" (ngSubmit)="search(searchForm)">
        <vp-filter-panel (filterChange)="onFilterChange($event)">
            <vp-section header="Company Search Criteria">
                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="contactType"
                                                   label="Contact Type"
                                                   type="select"
                                                   [options]="contactTypeOptions"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="name"
                                                   label="Name"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="contactName"
                                                   label="Contact Name"
                                                   [form]="searchForm" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="emailAddress"
                                                   label="Email Address"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="phoneNumber"
                                                   label="Phone Number"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="cellNumber"
                                                   label="Cell Number"
                                                   [form]="searchForm" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="hasBackflowTesting"
                                                   label="Backflow Program"
                                                   type="select"
                                                   [borderColor]="moduleColors.BACKFLOW"
                                                   [options]="yesNoOptions"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="hasCsiInspection"
                                                   label="CSI Program"
                                                   type="select"
                                                   [borderColor]="moduleColors.CSI"
                                                   [options]="yesNoOptions"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="hasFogInspection"
                                                   label="FOG Program"
                                                   type="select"
                                                   [borderColor]="moduleColors.FOG"
                                                   [options]="yesNoOptions"
                                                   [form]="searchForm" />
                        </div>

                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="hasFogTransportation"
                                                   label="FOG Transportation Program"
                                                   type="select"
                                                   [borderColor]="moduleColors.FOG"
                                                   [options]="yesNoOptions"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="nextContactDate"
                                                   label="Next Contact Date"
                                                   type="daterange"
                                                   [value]="defaultNextContactDateRange"
                                                   [form]="searchForm" />
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="lastContactDate"
                                                   label="Last Contact Date"
                                                   type="daterange"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                </div>
            </vp-section>
        </vp-filter-panel>

        <div class="mt-3">
            <vp-validation-summary [form]="searchForm" />

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary vp-section-button">
                    <i class="fa-solid fa-magnifying-glass me-1"></i>
                    Search
                </button>
            </div>
        </div>
    </form>
</div>

<div *ngIf="showResults" [hidden]="activeTab !== 'search'">
    <div class="d-flex justify-content-end mb-3">
        <button type="button" class="btn btn-primary vp-section-button" (click)="showResults = false">
            <i class="fa-solid fa-magnifying-glass me-1"></i>
            Search Again
        </button>
    </div>

    <vp-section [header]="'Companies (' + (table.items?.pageInfo?.totalItems ?? 0) + ')'">
        <vp-table *ngIf="table.items"
                  [columns]="table.columns!"
                  [data]="table.items.data"
                  [showActionLabels]="false"
                  [canAdd]="true"
                  (add)="addCompany()"
                  [canViewDetails]="true"
                  (viewDetails)="viewCompany($event)"
                  [canDelete]="true"
                  (delete)="deleteCompany($event)"
                  [(pageInfo)]="table.items.pageInfo"
                  (pageInfoChange)="getCompanies()"
                  [(query)]="table.query"
                  (queryChange)="getCompanies()"
                  (queryReset)="getCompanies()" />
    </vp-section>
</div>

<ng-template #contactTypeCell let-rowData="rowData">
    <span class="text-nowrap">
        <i class="fa-solid fa-user me-1" [class]="rowData?.contactTypeIconClass"></i>
        {{ rowData?.contactTypeLabel }}
    </span>
</ng-template>

<ng-template #programCell let-rowData="rowData">
    <div class="d-flex gap-1">
        <span *ngFor="let program of rowData?.programs"
              class="d-inline-block rounded-1"
              style="width: 1rem; height: 1rem; border: 2px solid;"
              [style.border-color]="program.color"
              [style.background-color]="program.fillColor"
              [title]="program.title"></span>
    </div>
</ng-template>

<ng-template #cityStateCell let-rowData="rowData">
    {{ rowData?.cityState }}
</ng-template>

<ng-template #nextContactDateCell let-rowData="rowData">
    <!-- mediumDate, the format vp-table gives its own date columns (Last Contact Date). -->
    <span [class]="rowData?.nextContactDateClass">{{ rowData?.nextContactDate | date:'mediumDate' }}</span>
</ng-template>
