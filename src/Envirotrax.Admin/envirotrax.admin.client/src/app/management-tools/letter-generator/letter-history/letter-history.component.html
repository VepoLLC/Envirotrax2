<dp-loading-spinner *ngIf="isLoading" />

<vp-section header="Letter Generation Process History">
    <div class="table-responsive">
        <table class="table table-sm table-bordered table-hover align-middle text-nowrap mb-0">
            <thead>
                <tr class="vp-table-header">
                    <th>Process ID</th>
                    <th class="w-100">Date</th>
                    <th></th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let process of processes">
                    <td>{{ process.id }}</td>
                    <td>{{ process.processDate | date:'EEEE, MMMM d, y h:mm a' }}</td>
                    <td>
                        <button type="button" class="btn btn-primary btn-sm" (click)="viewFiles(process)">View Files</button>
                    </td>
                    <td>
                        <button type="button" class="btn btn-primary btn-sm" (click)="deleteProcess(process)">Delete</button>
                    </td>
                </tr>
                <tr *ngIf="!isLoading && processes.length === 0">
                    <td colspan="4" class="text-center">No letters have been generated.</td>
                </tr>
            </tbody>
        </table>
    </div>
</vp-section>
