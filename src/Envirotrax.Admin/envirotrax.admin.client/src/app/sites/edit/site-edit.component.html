<dp-loading-spinner [hidden]="!isLoading && !isSaving"></dp-loading-spinner>

@if (!isLoading && editableSite) {
    <form #form="ngForm">
        <div class="text-center mb-3">
            <ul class="vp-tabs nav nav-pills d-inline-flex">
                <li class="nav-item">
                    <a class="nav-link" role="button" [class.active]="selectedTab === 'details'"
                       (click)="onTabChange('details')">Details</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" role="button" [class.active]="selectedTab === 'logs'"
                       (click)="onTabChange('logs')">{{ recordLogTabTitle }}</a>
                </li>
            </ul>
        </div>

        <div [hidden]="selectedTab !== 'details'">
            <app-site-water-supplier-section [site]="editableSite" (changeWaterSupplier)="changeWaterSupplier()"></app-site-water-supplier-section>

            <div class="mt-3">
                <app-site-property-settings-section [site]="editableSite" [form]="form"></app-site-property-settings-section>
            </div>

            <div class="mt-3">
                <app-site-property-mailing-section [site]="editableSite" [form]="form" [stateOptions]="stateOptions"></app-site-property-mailing-section>
            </div>

            <div class="mt-3">
                <app-site-gis-section [site]="editableSite" [form]="form"></app-site-gis-section>
            </div>
        </div>

        <div class="mt-3" [hidden]="selectedTab !== 'logs'">
            <vp-record-log-list [logs]="recordLogs" [isLoading]="isLoadingRecordLogs" [recordLabel]="'site'" />
        </div>

        <div class="d-flex justify-content-center gap-2 mt-3">
            <!-- Delete / Copy / Drag-Drop Merge: presentational only for now (Vepo parity); no behavior wired yet. -->
            <button type="button"
                    class="btn btn-primary"
                    [disabled]="isSaving">
                <i class="fa-solid fa-trash-can me-1"></i>Delete
            </button>
            <button type="button"
                    class="btn btn-primary"
                    [disabled]="isSaving">
                <i class="fa-solid fa-copy me-1"></i>Copy
            </button>
            <button type="button"
                    class="btn btn-primary"
                    [disabled]="isSaving">
                <i class="fa-solid fa-code-merge me-1"></i>Drag/Drop Merge
            </button>
            <button type="button"
                    class="btn btn-primary"
                    (click)="save()"
                    [disabled]="isSaving">
                Save
            </button>
            <button type="button"
                    class="btn btn-primary"
                    (click)="close()"
                    [disabled]="isSaving">
                Close
            </button>
        </div>
    </form>
}
