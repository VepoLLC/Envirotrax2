<div class="text-center mb-3">
    <h1 class="h2">
        Notifications
    </h1>
</div>

<div class="mb-1">
    <ul class="vp-tabs nav nav-pills justify-content-center">
        @for (tab of tabs; track tab.path) {
            <li class="nav-item">
                <a class="nav-link" routerLinkActive="active"
                   [routerLink]="['/admin/notifications', tab.path]">
                    <i [class]="tab.iconCss" class="me-1"></i>{{ tab.title }}
                </a>
            </li>
        }
    </ul>
</div>

<router-outlet></router-outlet>
