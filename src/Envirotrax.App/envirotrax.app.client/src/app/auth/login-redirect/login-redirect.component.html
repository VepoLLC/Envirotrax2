<div>
    <dp-loading-spinner *ngIf="isLoading" message="Logging you in..."></dp-loading-spinner>

    <vp-section *ngIf="showAccountTypeChoice" header="Select Account Type">
        <p class="text-center">
            Your account has access to both a Professional account and a Water Supplier account.
            Select which one you want to log into.
        </p>

        <div class="row justify-content-center g-3">
            <div class="col-md-4">
                <button type="button"
                        class="btn btn-outline-primary w-100 py-4"
                        (click)="selectAccountType('professional')">
                    <i class="fa-solid fa-building-user d-block mb-2 fs-3"></i>
                    Professional
                </button>
            </div>

            <div class="col-md-4">
                <button type="button"
                        class="btn btn-outline-primary w-100 py-4"
                        (click)="selectAccountType('waterSupplier')">
                    <i class="fa-solid fa-droplet d-block mb-2 fs-3"></i>
                    Water Supplier
                </button>
            </div>
        </div>
    </vp-section>

    <vp-section *ngIf="showProfessionalSelection" header="Professional Login">
        <p class="text-center">
            Your account may access the following Professional accounts. Select one below to access.
        </p>

        <ul class="list-group">
            <li *ngFor="let professional of professionals?.data"
                class="list-group-item list-group-item-action"
                (click)="selectProfessional(professional)">
                {{ professional.name }}
            </li>
        </ul>
    </vp-section>

    <vp-water-supplier-hierarchy *ngIf="showWaterSupplierSelection" [mySuppliers]="suppliers" />
</div>
