@if (isLoading) {
    <dp-loading-spinner />
}

@if (!isLoading) {
    @if (report && report.points.length > 0) {

        <div class="mb-3">
            <vp-section header="New/Removed Assemblies" [noPadding]="true">
                <div class="d-flex justify-content-center pt-2 pb-0">
                    <vp-dropdown [label]="'Download Printable Report'" [showCaret]="true" placement="bottom" buttonClass="btn-primary btn-sm">
                        <vp-dropdown-option (click)="downloadPDF()">PDF</vp-dropdown-option>
                        <vp-dropdown-option (click)="downloadWord()">Word Document</vp-dropdown-option>
                        <vp-dropdown-option (click)="downloadExcel()">Excel</vp-dropdown-option>
                    </vp-dropdown>
                </div>
                <div class="bf-chart-scroll">
                    <div class="bf-chart-canvas" [style.minWidth.px]="chartPixelWidth">
                        <canvas baseChart
                                [data]="barChartData"
                                [options]="barChartOptions"
                                [type]="barChartType"
                                [plugins]="barChartPlugins">
                        </canvas>
                    </div>
                </div>
            </vp-section>
        </div>
    }
}
