<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input name="manufacturer"
                      label="Manufacturer"
                      [(ngModel)]="gauge.manufacturer"
                      [required]="true"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="model"
                      label="Model"
                      [(ngModel)]="gauge.model"
                      [required]="true"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="serialNumber"
                      label="Serial number"
                      [(ngModel)]="gauge.serialNumber"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="lastCalibrationDate"
                      label="Calibration date"
                      type="date"
                      [(ngModel)]="gauge.lastCalibrationDate"
                      [form]="form" />
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox"
                   class="form-check-input"
                   id="isPortable"
                   name="isPortable"
                   [(ngModel)]="gauge.isPortable" />
            <label class="form-check-label" for="isPortable">Portable</label>
        </div>

        <div *ngIf="!isEditMode" class="mb-3">
            <vp-file-upload name="calibrationFile"
                            validationLabel="Calibration certificate"
                            accept=".jpg, .jpeg, .gif, .png, .bmp, .pdf"
                            [(ngModel)]="calibrationFile"
                            [required]="true"
                            [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
