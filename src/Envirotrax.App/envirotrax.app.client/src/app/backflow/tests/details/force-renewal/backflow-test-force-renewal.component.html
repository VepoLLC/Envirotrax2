<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading"></dp-loading-spinner>

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox"
                   id="forceRenewalCheck"
                   name="forceRenewal"
                   [(ngModel)]="forceRenewal">
            <label class="form-check-label" for="forceRenewalCheck">Force Renewal Settings</label>
        </div>

        <div class="mb-3">
            <label class="form-label">Renewal Years: </label>
            <select class="form-select" name="forceRenewalYears" [(ngModel)]="forceRenewalYears">
                <option *ngFor="let opt of yearOptions" [ngValue]="opt.value">{{ opt.label }}</option>
            </select>
        </div>

        <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

        <div class="d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-primary w-100">
                Ok
            </button>
            <button type="button" class="btn btn-primary w-100" (click)="cancel()">
                Cancel
            </button>
        </div>
    </form>
</div>
