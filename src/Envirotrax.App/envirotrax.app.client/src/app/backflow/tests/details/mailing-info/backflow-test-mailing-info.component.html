<vp-section header="Contact / Mailing Information">
    <form #mailingForm="ngForm" dp-spinner-parent>
        <dp-loading-spinner *ngIf="saving"></dp-loading-spinner>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Company Name:</div>
            <div class="col-xl-9">
                <vp-input name="mailingCompanyName" [maxLength]="100"
                          [form]="mailingForm" [disabled]="!canModify"
                          [(ngModel)]="test.mailingCompanyName" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Contact Name:</div>
            <div class="col-xl-9">
                <vp-input name="mailingContactName" [maxLength]="100"
                          [form]="mailingForm" [disabled]="!canModify"
                          [(ngModel)]="test.mailingContactName" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Address:</div>
            <div class="col-xl-9">
                <button type="button" class="btn btn-primary vp-section-button mt-2" *ngIf="canModify"
                        (click)="copyFromPropertyAddress()">
                    Copy from Property Address
                </button>

                <div class="row g-2">
                    <div class="col-3">
                        <vp-input name="mailingStreetNumber" label="Street #:"
                                  [form]="mailingForm" [disabled]="!canModify"
                                  [(ngModel)]="test.mailingStreetNumber" />
                    </div>
                    <div class="col-6">
                        <vp-input name="mailingStreetName" label="Street Name:"
                                  [form]="mailingForm" [disabled]="!canModify"
                                  [(ngModel)]="test.mailingStreetName" />
                    </div>
                    <div class="col-3">
                        <vp-input name="mailingNumber" label="Suite/Apt #:"
                                  [form]="mailingForm" [disabled]="!canModify"
                                  [(ngModel)]="test.mailingNumber" />
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">City:</div>
            <div class="col-xl-9">
                <vp-input name="mailingCity" [form]="mailingForm"
                          [disabled]="!canModify" [(ngModel)]="test.mailingCity" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">State:</div>
            <div class="col-xl-9">
                <vp-input name="mailingStateId" type="select" [form]="mailingForm"
                          [options]="states" [disabled]="!canModify"
                          [ngModel]="test.mailingState?.id"
                          (ngModelChange)="mailingStateChanged($event)" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">ZIP:</div>
            <div class="col-xl-9">
                <vp-input name="mailingZip" [maxLength]="20" [form]="mailingForm"
                          [disabled]="!canModify" [(ngModel)]="test.mailingZip" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Phone Number:</div>
            <div class="col-xl-9">
                <vp-input name="mailingPhoneNumber"
                          [form]="mailingForm" [disabled]="!canModify"
                          [(ngModel)]="test.mailingPhoneNumber" />
            </div>
        </div>
        <div class="mb-3">
            <vp-input name="mailingEmailAddress" label="Email Address" type="multi-email" [maxLength]="1000"
                      [form]="mailingForm" [disabled]="!canModify"
                      [(ngModel)]="test.mailingEmailAddress" />
        </div>

        <div class="d-flex justify-content-end mt-2" *ngIf="canModify">
            <button type="button" class="btn btn-primary vp-section-button" [disabled]="saving"
                    (click)="save.emit(mailingForm)">
                Update
            </button>
        </div>
    </form>
</vp-section>
