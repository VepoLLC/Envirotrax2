<vp-section header="Location / Property Information">
    <form #propertyForm="ngForm" dp-spinner-parent>
        <dp-loading-spinner *ngIf="saving"></dp-loading-spinner>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Property Type:</div>
            <div class="col-xl-9">
                <vp-input name="propertyType" type="select" [form]="propertyForm"
                          [options]="propertyTypeOptions" [disabled]="!canModify"
                          [(ngModel)]="test.propertyType" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">Business Name:</div>
            <div class="col-xl-9">
                <vp-input name="propertyBusinessName" [maxLength]="100"
                          [form]="propertyForm" [disabled]="!canModify"
                          [(ngModel)]="test.propertyBusinessName" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 fw-bold d-xl-flex align-items-xl-center justify-content-xl-end">Address:</div>
            <div class="col-xl-9">
                <div class="row g-2">
                    <div class="col-3">
                        <vp-input name="propertyStreetNumber" label="Street #:"
                                  [form]="propertyForm" [disabled]="!canModify"
                                  [(ngModel)]="test.propertyStreetNumber" />
                    </div>
                    <div class="col-6">
                        <vp-input name="propertyStreetName" label="Street Name:"
                                  [form]="propertyForm" [disabled]="!canModify"
                                  [(ngModel)]="test.propertyStreetName" />
                    </div>
                    <div class="col-3">
                        <vp-input name="propertyNumber" label="Suite/Apt #:"
                                  [form]="propertyForm" [disabled]="!canModify"
                                  [(ngModel)]="test.propertyNumber" />
                    </div>
                </div>
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">City:</div>
            <div class="col-xl-9">
                <vp-input name="propertyCity" [form]="propertyForm"
                          [disabled]="!canModify" [(ngModel)]="test.propertyCity" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">State:</div>
            <div class="col-xl-9">
                <vp-input name="propertyStateId" type="select" [form]="propertyForm"
                          [options]="states" [disabled]="!canModify"
                          [ngModel]="test.propertyState?.id"
                          (ngModelChange)="propertyStateChanged($event)" />
            </div>
        </div>

        <div class="row mb-2">
            <div class="col-xl-3 col-form-label fw-bold text-xl-end">ZIP:</div>
            <div class="col-xl-9">
                <vp-input name="propertyZip" [maxLength]="20" [form]="propertyForm"
                          [disabled]="!canModify" [(ngModel)]="test.propertyZip" />
            </div>
        </div>

        <div class="d-flex justify-content-between mt-2">
            <button type="button" class="btn btn-primary vp-section-button"
                    [disabled]="test.site?.id == null" (click)="viewPropertyRecord()">
                View Property Record
            </button>
            <button type="button" class="btn btn-primary vp-section-button" *ngIf="canModify"
                    [disabled]="saving" (click)="save.emit(propertyForm)">
                Update
            </button>
        </div>
    </form>
</vp-section>
