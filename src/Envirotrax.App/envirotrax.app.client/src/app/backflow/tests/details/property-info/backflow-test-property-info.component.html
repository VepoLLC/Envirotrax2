<vp-section header="Location / Property Information">
    <form #propertyForm="ngForm" dp-spinner-parent>
        <dp-loading-spinner *ngIf="saving"></dp-loading-spinner>
        <div class="mb-3">
            <vp-input name="propertyType" label="Property type" type="select" [form]="propertyForm"
                      [options]="propertyTypeOptions" [disabled]="!canModify"
                      [(ngModel)]="test.propertyType" />
        </div>
        <div class="mb-3">
            <vp-input name="propertyBusinessName" label="Business name" [maxLength]="100"
                      [form]="propertyForm" [disabled]="!canModify"
                      [(ngModel)]="test.propertyBusinessName" />
        </div>
        <p class="fw-bold">Property Address</p>
        <div class="row">
            <div class="col-md-4 mb-3">
                <vp-input name="propertyStreetNumber" label="Street #"
                          [form]="propertyForm" [disabled]="!canModify"
                          [(ngModel)]="test.propertyStreetNumber" />
            </div>
            <div class="col-md-5 mb-3">
                <vp-input name="propertyStreetName" label="Street name"
                          [form]="propertyForm" [disabled]="!canModify"
                          [(ngModel)]="test.propertyStreetName" />
            </div>
            <div class="col-md-3 mb-3">
                <vp-input name="propertyNumber" label="Suite/Apt #"
                          [form]="propertyForm" [disabled]="!canModify"
                          [(ngModel)]="test.propertyNumber" />
            </div>
        </div>
        <div class="mb-3">
            <vp-input name="propertyCity" label="City" [form]="propertyForm"
                      [disabled]="!canModify" [(ngModel)]="test.propertyCity" />
        </div>
        <div class="row">
            <div class="col-md-6 mb-3">
                <vp-input name="propertyStateId" label="State" type="select" [form]="propertyForm"
                          [options]="states" [disabled]="!canModify"
                          [ngModel]="test.propertyState?.id"
                          (ngModelChange)="propertyStateChanged($event)" />
            </div>
            <div class="col-md-6 mb-3">
                <vp-input name="propertyZip" label="ZIP" [maxLength]="20" [form]="propertyForm"
                          [disabled]="!canModify" [(ngModel)]="test.propertyZip" />
            </div>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <button type="button" class="btn btn-primary vp-section-button"
                    [disabled]="test.site?.id == null" (click)="viewPropertyRecord()">
                View Property Record
            </button>
            <button type="button" class="btn btn-primary vp-section-button" *ngIf="canModify"
                    [disabled]="saving" (click)="save.emit(propertyForm)">
                Update
            </button>
        </div>
    </form>
</vp-section>
