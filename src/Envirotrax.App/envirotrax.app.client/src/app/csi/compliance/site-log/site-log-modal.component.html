<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading"></dp-loading-spinner>

    <div *ngIf="!showForm">
        <div class="d-flex justify-content-end mb-3" *ngIf="canModify">
            <button type="button" class="btn btn-primary btn-sm" (click)="startAdd()">
                <i class="fa-solid fa-plus me-1"></i>
                Add Log
            </button>
        </div>

        <div *ngIf="logs.length === 0" class="text-center py-3 text-muted">
            No log records for this property.
        </div>

        <div *ngFor="let log of logs" class="border rounded p-2 mb-2">
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <span class="fw-semibold">{{ log.typeLabel }}</span>
                    <span class="text-muted ms-2">{{ log.createdTime | date:'short' }}</span>
                    <span *ngIf="log.createdBy?.email" class="text-muted ms-2">{{ log.createdBy?.email }}</span>
                </div>
                <div class="d-flex gap-1" *ngIf="canModify">
                    <button type="button" class="btn btn-sm btn-outline-secondary" (click)="startEdit(log)">
                        <i class="fa-regular fa-pen"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger" (click)="deleteLog(log)">
                        <i class="fa-regular fa-trash"></i>
                    </button>
                </div>
            </div>

            <div *ngIf="log.logType !== SiteLogType.Note && log.reviewDate" class="mt-1">
                <span class="fw-semibold">Review Date:</span>
                <span class="badge rounded-pill ms-1" [ngClass]="log.reviewClass">{{ log.reviewDate | date }}</span>
            </div>

            <p class="mt-2 mb-1" *ngIf="log.noteText">{{ log.noteText }}</p>

            <div *ngIf="log.url" class="mt-1">
                <a [href]="log.url" target="_blank">
                    <i class="fa-solid fa-paperclip me-1"></i>{{ log.fileAttachmentName }}
                </a>
            </div>
        </div>

        <div class="d-flex justify-content-end mt-3">
            <button type="button" class="btn btn-primary" (click)="close()">Close</button>
        </div>
    </div>

    <form *ngIf="showForm" #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <label class="form-label">Log Type</label>
            <select class="form-select" name="logType" [(ngModel)]="formType">
                <option [ngValue]="SiteLogType.Note">Note</option>
                <option [ngValue]="SiteLogType.Reminder">Scheduled Review</option>
                <option [ngValue]="SiteLogType.CompletedReminder">Completed Review</option>
            </select>
        </div>

        <div class="mb-3" *ngIf="formType !== SiteLogType.Note">
            <vp-input name="reviewDate"
                      label="Review date"
                      type="date"
                      [(ngModel)]="formReviewDate"
                      [form]="form" />
        </div>

        <div class="mb-3" *ngIf="assemblyOptions.length > 0">
            <label class="form-label">Tagged Assembly</label>
            <select class="form-select" name="assemblyId" [(ngModel)]="formAssemblyId">
                <option value="">N/A</option>
                <option *ngFor="let assembly of assemblyOptions" [value]="assembly.id">{{ assembly.text }}</option>
            </select>
        </div>

        <div class="mb-3">
            <vp-input type="textarea"
                      name="note"
                      label="Note"
                      [(ngModel)]="formNote"
                      [maxLength]="1000"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-file-upload name="logFile"
                            validationLabel="Attachment"
                            accept=".jpg, .jpeg, .png, .bmp, .tif, .tiff, .pdf, .xlsx, .xls, .txt, .doc, .docx"
                            [(ngModel)]="formFile"
                            [required]="false"
                            [form]="form" />
        </div>

        <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

        <div class="d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-primary" (click)="cancelForm()">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
