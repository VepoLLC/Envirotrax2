<h1 class="text-center h2">FOG Management</h1>

<div [hidden]="showResults">
    <form #searchForm="ngForm" (ngSubmit)="search(searchForm)">
        <vp-filter-panel (filterChange)="onFilterChange($event)">
            <vp-section header="Inspector Account Search Criteria">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="companyEmail"
                                                   label="Company email"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="name"
                                                   label="Company name"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="address"
                                                   label="Address"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="phoneNumber"
                                                   label="Company phone"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="inspectorLicenseNumber"
                                                   label="Inspector license number"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-2">
                            <vp-filter-panel-field fieldName="insurancePolicyNumber"
                                                   label="Insurance policy number"
                                                   labelStyle="horizontal"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary vp-section-button">
                            <i class="fa-solid fa-magnifying-glass me-1"></i>
                            Search
                        </button>
                    </div>
                </div>
            </vp-section>
        </vp-filter-panel>
    </form>
</div>

<dp-loading-spinner *ngIf="table.isLoading"></dp-loading-spinner>

<ng-template #addressCell let-inspector="rowData">
    <div>
        <div>{{inspector.address}} {{inspector.city}}<span
                  *ngIf="(inspector.address || inspector.city) && (inspector.state || inspector.zipCode)">, </span>
        </div>
        <div>{{inspector.state?.code}} {{inspector.zipCode}}</div>
    </div>
</ng-template>

<div *ngIf="showResults">

    <div class="d-flex justify-content-between mb-3">
        <button type="button"
                class="btn btn-primary vp-section-button"
                title="Export excel"
                aria-label="Export excel">
            <i class="fa-solid fa-circle-plus me-1"></i>
            Export Excel
        </button>

        <button type="button"
                class="btn btn-primary vp-section-button"
                (click)="showResults = false;">
            Search Again
        </button>
    </div>

    <vp-section header="Inspector Search Results">
        <vp-table *ngIf="table.items"
                  [columns]="table.columns!"
                  [data]="table.items.data"
                  [(pageInfo)]="table.items.pageInfo"
                  (pageInfoChange)="getInspectors()"
                  [(query)]="table.query"
                  (queryChange)="getInspectors()"
                  (queryReset)="getInspectors()"
                  [freeTextSearch]="table.freeTextSearch"
                  [canViewDetails]="true"
                  (viewDetails)="openDetails($event)" />
    </vp-section>

</div>
