<h1 class="text-center h2">FOG Management</h1>

<div [hidden]="showResults">
    <form #searchForm="ngForm" (ngSubmit)="search(searchForm)">
        <vp-filter-panel (filterChange)="onFilterChange($event)">
            <vp-section header="Transporter Account Search Criteria">
                <div class="row">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="companyEmail"
                                                   label="Company email"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="name"
                                                   label="Company name"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="address"
                                                   label="Address"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="phoneNumber"
                                                   label="Company phone"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="registrationNumber"
                                                   label="Registration number"
                                                   [form]="searchForm" />
                        </div>
                        <div class="mb-3">
                            <vp-filter-panel-field fieldName="insurancePolicyNumber"
                                                   label="Insurance policy number"
                                                   [form]="searchForm" />
                        </div>
                    </div>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary vp-section-button">
                            <i class="fa-solid fa-magnifying-glass me-1"></i>
                            Search
                        </button>
                    </div>
                </div>
            </vp-section>
        </vp-filter-panel>
    </form>
</div>

<dp-loading-spinner *ngIf="table.isLoading"></dp-loading-spinner>

<ng-template #addressCell let-transporter="rowData">
    <div>
        <div>{{transporter.address}} {{transporter.city}}<span
                  *ngIf="(transporter.address || transporter.city) && (transporter.state || transporter.zipCode)">, </span>
        </div>
        <div>{{transporter.state?.code}} {{transporter.zipCode}}</div>
    </div>
</ng-template>

<div *ngIf="showResults">

    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <button type="button"
                class="btn btn-primary vp-section-button flex-grow-1 flex-lg-grow-0"
                (click)="showDownloadManager()"
                title="Export results"
                aria-label="Export results">
            <i class="fa-regular fa-file-export me-1"></i>
            Export Results
        </button>

        <button type="button"
                class="btn btn-primary vp-section-button flex-grow-1 flex-lg-grow-0"
                (click)="showResults = false;">
            Search Again
        </button>
    </div>

    <vp-section header="Transporter Search Results">
        <vp-table *ngIf="table.items"
                    [columns]="table.columns!"
                    [data]="table.items.data"
                    [(pageInfo)]="table.items.pageInfo"
                    (pageInfoChange)="getTransporters()"
                    [(query)]="table.query"
                    (queryChange)="getTransporters()"
                    (queryReset)="getTransporters()"
                    [freeTextSearch]="table.freeTextSearch"
                    [canViewDetails]="true"
                    (viewDetails)="openDetails($event)" />
    </vp-section>

</div>
