<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <div class="mb-3">
        <div class="fw-bold">{{ transporterName }}</div>
        <div class="text-muted small">{{ vehicleDescription }}</div>
    </div>

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input name="permitNumber"
                      label="Permit number"
                      [(ngModel)]="permit.permitNumber"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input type="date"
                      name="inspectionDueDate"
                      label="Inspection due date"
                      [(ngModel)]="permit.inspectionDueDate"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" type="checkbox"
                       [(ngModel)]="permit.isActive"
                       name="isActive" id="isActive">
                <label class="form-check-label" for="isActive">Active</label>
            </div>
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary w-100" (click)="cancel()">Cancel</button>
                <button type="submit" class="btn btn-primary w-100">Save</button>
            </div>
        </div>
    </form>
</div>
