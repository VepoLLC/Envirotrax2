<h1 class="text-center h2">Account Balance Management</h1>

<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-4">
            <vp-section header="Account Balance">
                <div class="mx-auto w-50">
                    <vp-input name="currentBalance"
                              label="Current Account Balance: $"
                              labelStyle="horizontal"
                              type="number"
                              [decimals]="2"
                              [readonly]="true"
                              [ngModel]="professional.accountBalance" />
                </div>
                <div class="mx-auto w-50">
                    <vp-input name="amountToAdd"
                              label="Amount to Add: $"
                              labelStyle="horizontal"
                              type="number"
                              [required]="true"
                              [decimals]="2"
                              [min]="0.01"
                              [step]="0.01"
                              [form]="form"
                              [(ngModel)]="amountToAdd" />
                </div>

                            
            </vp-section>
        </div>

        <div class="row mb-4">
            <div class="col-md-6 mb-3">
                <vp-section header="Billing Information">

                            <vp-input name="billingFirstName"
                                    label="First Name:"
                                    labelStyle="horizontal"
                                    [required]="true"
                                    [maxLength]="255"
                                    [form]="form"
                                    [(ngModel)]="professional.billingFirstName" />
                        
                            <vp-input name="billingLastName"
                                    label="Last Name:"
                                    labelStyle="horizontal"
                                    [required]="true"
                                    [maxLength]="255"
                                    [form]="form"
                                    [(ngModel)]="professional.billingLastName" />
                       
                            <vp-input name="billingAddress"
                                    label="Address:"
                                    labelStyle="horizontal"
                                    [required]="true"
                                    [maxLength]="255"
                                    [form]="form"
                                    [(ngModel)]="professional.billingAddress" />
                        
                            <vp-input name="billingCity"
                                    label="City:"
                                    labelStyle="horizontal"
                                    [required]="true"
                                    [maxLength]="255"
                                    [form]="form"
                                    [(ngModel)]="professional.billingCity" />
                        
                            <vp-input name="billingStateId"
                                    label="State:"
                                    labelStyle="horizontal"
                                    type="select"
                                    [required]="true"
                                    [form]="form"
                                    [ngModel]="professional.billingState?.id"
                                    [options]="states"
                                    (ngModelChange)="stateChanged($event)" />
                        
                            <vp-input name="billingZipCode"
                                    label="ZIP/Postal Code:"
                                    labelStyle="horizontal"
                                    [required]="true"
                                    [maxLength]="25"
                                    [form]="form"
                                    [(ngModel)]="professional.billingZipCode" />
                        
                  
                </vp-section>
            </div>
            <div class="col-md-6 mb-3">
                <vp-section header="Credit Card">
                    <div class="h-100 d-flex justify-content-center align-items-center">
                        <app-credit-card-payment (tokenCaptured)="onTokenCaptured($event)" />
                    </div>
                </vp-section>
            </div>

        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-center">
                <button type="submit" class="btn btn-primary vp-section-button" [disabled]="!cardToken">
                    Continue
                </button>
            </div>
        </div>
    </form>
</div>
