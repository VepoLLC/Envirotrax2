<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input name="manufacturer"
                      label="Manufacturer"
                      [(ngModel)]="gauge.manufacturer"
                      [required]="true"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="model"
                      label="Model"
                      [(ngModel)]="gauge.model"
                      [required]="true"
                      [maxLength]="100"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="serialNumber"
                      label="Serial Number"
                      [(ngModel)]="gauge.serialNumber"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <label class="col-form-label"
                   [class.text-danger]="form.submitted && gauge.isPortable == null">
                For use on what type of water system
                <span class="text-danger">*</span>
            </label>

            <div class="d-flex">
                <div class="form-check form-check-inline">
                    <input id="water-system-potable-edit"
                           type="radio"
                           class="form-check-input"
                           name="isPortable"
                           [value]="true"
                           [(ngModel)]="gauge.isPortable"
                           required>
                    <label for="water-system-potable-edit" class="form-check-label">
                        Potable
                    </label>
                </div>

                <div class="form-check form-check-inline ms-4">
                    <input id="water-system-non-potable-edit"
                           type="radio"
                           class="form-check-input"
                           name="isPortable"
                           [value]="false"
                           [(ngModel)]="gauge.isPortable">
                    <label for="water-system-non-potable-edit" class="form-check-label">
                        Non-Potable
                    </label>
                </div>
            </div>
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary vp-section-button w-100" (click)="cancel()">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary vp-section-button w-100">
                    Save
                </button>
            </div>
        </div>
    </form>
</div>
