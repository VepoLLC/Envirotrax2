<div>
    <header class="text-center">
        <h1 class="h2">
            Checkout
        </h1>
    </header>

    <div class="text-center mb-3">
        <ul class="vp-tabs nav nav-pills settings-tabs d-inline-flex vp-checkout-tabs-desktop">
            <li *ngIf="canViewBackflowTesting" class="nav-item">
                <a class="nav-link" [class.active]="activeTab === 'backflow'" (click)="setActiveTab('backflow')">
                    <i class="fa-regular fa-gauge me-2"></i>Backflow Tester
                </a>
            </li>
            <li *ngIf="canViewCsiInspection" class="nav-item">
                <a class="nav-link" [class.active]="activeTab === 'csi'" (click)="setActiveTab('csi')">
                    <i class="fa-solid fa-building-magnifying-glass me-2"></i>CSI Inspector
                </a>
            </li>
            <li *ngIf="canViewFogInspection" class="nav-item">
                <a class="nav-link" [class.active]="activeTab === 'fogInspection'" (click)="setActiveTab('fogInspection')">
                    <i class="fa-regular fa-tank-water me-2"></i>FOG Inspector
                </a>
            </li>
            <li *ngIf="canViewFogTransportation" class="nav-item">
                <a class="nav-link" [class.active]="activeTab === 'fogTransport'" (click)="setActiveTab('fogTransport')">
                    <i class="fa-regular fa-tank-water me-2"></i>FOG Transporter
                </a>
            </li>
        </ul>

        <vp-dropdown class="vp-checkout-tabs-mobile"
                     [label]="getTabLabel(activeTab)"
                     [iconCss]="getTabIcon(activeTab) + ' me-2'"
                     [showCaret]="true"
                     placement="top"
                     buttonClass="btn-primary">
            <vp-dropdown-option *ngIf="canViewBackflowTesting && activeTab !== 'backflow'" (click)="setActiveTab('backflow')">
                <i class="fa-regular fa-gauge me-2"></i>Backflow Tester
            </vp-dropdown-option>
            <vp-dropdown-option *ngIf="canViewCsiInspection && activeTab !== 'csi'" (click)="setActiveTab('csi')">
                <i class="fa-solid fa-building-magnifying-glass me-2"></i>CSI Inspector
            </vp-dropdown-option>
            <vp-dropdown-option *ngIf="canViewFogInspection && activeTab !== 'fogInspection'" (click)="setActiveTab('fogInspection')">
                <i class="fa-regular fa-tank-water me-2"></i>FOG Inspector
            </vp-dropdown-option>
            <vp-dropdown-option *ngIf="canViewFogTransportation && activeTab !== 'fogTransport'" (click)="setActiveTab('fogTransport')">
                <i class="fa-regular fa-tank-water me-2"></i>FOG Transporter
            </vp-dropdown-option>
        </vp-dropdown>
    </div>

    <vp-checkout-backflow *ngIf="activeTab === 'backflow' && canViewBackflowTesting" [isAdmin]="isAdmin" />
    <vp-checkout-csi *ngIf="activeTab === 'csi' && canViewCsiInspection" [isAdmin]="isAdmin" />
    <vp-checkout-fog-inspection *ngIf="activeTab === 'fogInspection' && canViewFogInspection" [isAdmin]="isAdmin" />
    <vp-checkout-fog-transport *ngIf="activeTab === 'fogTransport' && canViewFogTransportation" [isAdmin]="isAdmin" />
</div>
