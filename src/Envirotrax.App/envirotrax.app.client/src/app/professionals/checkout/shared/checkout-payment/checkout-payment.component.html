<form #form="ngForm" class="mt-4">
    @if (cardCharge > 0) {
        <vp-section header="Billing Information">
            <div class="row">
                <div class="col-md-6">
                    <vp-field-grid>
                        <vp-input name="billingFirstName"
                                  label="First Name:"
                                  labelStyle="horizontal"
                                  [required]="true"
                                  [maxLength]="255"
                                  [form]="form"
                                  [(ngModel)]="professionalUser.billingFirstName" />

                        <vp-input name="billingLastName"
                                  label="Last Name:"
                                  labelStyle="horizontal"
                                  [required]="true"
                                  [maxLength]="255"
                                  [form]="form"
                                  [(ngModel)]="professionalUser.billingLastName" />

                        <vp-input name="billingAddress"
                                  label="Address:"
                                  labelStyle="horizontal"
                                  [required]="true"
                                  [maxLength]="255"
                                  [form]="form"
                                  [(ngModel)]="professionalUser.billingAddress" />
                    </vp-field-grid>
                </div>
                <div class="col-md-6">
                    <vp-field-grid>
                        <vp-input name="billingCity"
                                  label="City:"
                                  labelStyle="horizontal"
                                  [required]="true"
                                  [maxLength]="255"
                                  [form]="form"
                                  [(ngModel)]="professionalUser.billingCity" />

                        <vp-input name="billingStateId"
                                  label="State:"
                                  labelStyle="horizontal"
                                  type="select"
                                  [required]="true"
                                  [form]="form"
                                  [ngModel]="professionalUser.billingState?.id"
                                  [options]="states"
                                  (ngModelChange)="stateChanged($event)" />

                        <vp-input name="billingZipCode"
                                  label="ZIP/Postal Code:"
                                  labelStyle="horizontal"
                                  [required]="true"
                                  [maxLength]="25"
                                  [form]="form"
                                  [(ngModel)]="professionalUser.billingZipCode" />
                    </vp-field-grid>
                </div>
            </div>

            <div class="mt-4 text-center">
                <p class="text-muted fst-italic mb-2">
                    Click Continue to securely enter your card details and complete this payment.
                </p>
                <app-credit-card-payment [disabled]="!!form.invalid || isLoading"
                                         (tokenCaptured)="onCardTokenCaptured($event, form)" />
            </div>
        </vp-section>
    } @else {
        <div class="text-center">
            <button type="button" class="btn btn-primary vp-section-button" [disabled]="isLoading"
                    (click)="completeSubmission()">
                Complete Submission
            </button>
        </div>
    }

    <div class="mt-3">
        <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />
    </div>
</form>
