<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input name="licensePlateNumber"
                      label="License Plate #"
                      [(ngModel)]="vehicle.licensePlateNumber"
                      [required]="true"
                      [maxLength]="20"
                      [form]="form" />
        </div>
        <div class="mb-3">
            <vp-input name="manufacturer"
                      label="Manufacturer"
                      [(ngModel)]="vehicle.manufacturer"
                      [required]="true"
                      [maxLength]="255"
                      [form]="form" />
        </div>
        <div class="mb-3">
            <vp-input type="number"
                      name="manufacturedYear"
                      label="Year"
                      [(ngModel)]="vehicle.manufacturedYear"
                      [required]="true"
                      [form]="form" />
        </div>
        <div class="mb-3">
            <vp-input type="number"
                      name="capacity"
                      label="Holding Capacity"
                      [(ngModel)]="vehicle.capacity"
                      [required]="true"
                      [form]="form" />
        </div>
        <div class="mb-3">
            <vp-input type="select"
                      name="capacityType"
                      label="Capacity Type"
                      placeholder="Select Capacity Type"
                      [(ngModel)]="vehicle.capacityType"
                      [options]="capacityTypeOptions"
                      [required]="true"
                      [form]="form" />
        </div>
        <div class="mb-3">
            <vp-input name="stickerNumber"
                      label="Sticker #"
                      [(ngModel)]="vehicle.stickerNumber"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary vp-section-button w-100" (click)="cancel()">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary vp-section-button w-100">
                    Save
                </button>
            </div>
        </div>
    </form>
</div>
