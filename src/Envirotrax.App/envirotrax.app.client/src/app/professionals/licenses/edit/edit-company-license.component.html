<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form *ngIf="license.id" #form="ngForm" (ngSubmit)="save(form)">
        <div class="mb-3">
            <vp-input type="select"
                      name="licenseType"
                      label="Type"
                      [ngModel]="license.licenseType?.id"
                      (ngModelChange)="licenseTypeChange($event)"
                      [required]="true"
                      [options]="licenseTypes"
                      [form]="form" />
        </div>

        <div class="mb-3">
            <vp-input name="licenseNumber"
                      label="License Number"
                      [(ngModel)]="license.licenseNumber"
                      [required]="true"
                      [maxLength]="50"
                      [form]="form" />
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" [validationErrors]="validationErrors" />

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-primary vp-section-button w-100" (click)="cancel()">
                    Cancel
                </button>
                <button type="submit" class="btn btn-primary vp-section-button w-100">
                    Save
                </button>
            </div>
        </div>
    </form>
</div>
