<h1 class="text-center h2">Payment Receipts</h1>

<ng-template #dateCell let-transaction="rowData">
    {{ transaction.transactionDate | date: 'short' }}
</ng-template>

<ng-template #receiptCell let-transaction="rowData">
    <button type="button" class="btn btn-primary btn-sm" (click)="viewReceipt(transaction)">
        Receipt
    </button>
</ng-template>

<vp-section header="Transaction Details">
    <div dp-spinner-parent>
        <dp-loading-spinner *ngIf="isLoading" message="Loading Payments" />

        <div class="d-flex align-items-center gap-3 flex-wrap mb-3">
            <select class="form-select w-auto" name="transactionType" [(ngModel)]="transactionType">
                @for (option of transactionTypeOptions; track option.id) {
                    <option [value]="option.id">{{ option.text }}</option>
                }
            </select>

            <span class="fw-bold">From:</span>
            <input type="date" class="form-control w-auto" name="fromDate" [(ngModel)]="fromDate" />

            <span class="fw-bold">To:</span>
            <input type="date" class="form-control w-auto" name="toDate" [(ngModel)]="toDate" />

            <button type="button" class="btn btn-primary" [disabled]="!fromDate || !toDate" (click)="search()">
                Search
            </button>
        </div>

        <vp-table *ngIf="table.items"
                  [columns]="table.columns!"
                  [data]="table.items.data"
                  [(pageInfo)]="table.items.pageInfo"
                  (pageInfoChange)="getTransactions()"
                  [(query)]="table.query"
                  (queryChange)="getTransactions()"
                  (queryReset)="getTransactions()" />
    </div>
</vp-section>
