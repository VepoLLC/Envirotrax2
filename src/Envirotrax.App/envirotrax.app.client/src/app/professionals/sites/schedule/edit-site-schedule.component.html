<div dp-spinner-parent>
    <dp-loading-spinner *ngIf="isLoading" />

    <form #form="ngForm" (ngSubmit)="save(form)">
        <div *ngIf="hasMultipleScheduleTypes" class="mb-3">
            <vp-input name="professionalType"
                      label="Service"
                      type="select"
                      [form]="form"
                      [ngModel]="selectedScheduleType"
                      [options]="scheduleTypeOptions"
                      (ngModelChange)="scheduleTypeChanged($event)" />
        </div>

        <div class="d-flex align-items-center gap-3">
            <i class="fa-solid fa-clock fa-2x text-primary"></i>

            <div class="flex-grow-1">
                <vp-input name="scheduleDate"
                          type="datetime"
                          [(ngModel)]="schedule.scheduleDate"
                          [required]="true"
                          [form]="form" />
            </div>
        </div>

        <div class="mt-3">
            <vp-validation-summary [form]="form" />

            <div class="d-flex justify-content-end gap-2">
                <button *ngIf="isScheduled" type="button" class="btn btn-primary vp-section-button w-100" (click)="clear()">
                    Clear
                </button>
                <button type="submit" class="btn btn-primary vp-section-button w-100">
                    OK
                </button>
                <button type="button" class="btn btn-primary vp-section-button w-100" (click)="cancel()">
                    Cancel
                </button>
            </div>
        </div>
    </form>
</div>
