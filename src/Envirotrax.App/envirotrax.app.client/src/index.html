<!doctype html>
<html lang="en" class="d-flex flex-column">

<head>
  <meta charset="utf-8">
  <title>Envirotrax</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="https://kit.fontawesome.com/5196faa6c2.js" crossorigin="anonymous"></script>
</head>

<body class="d-flex flex-column flex-fill bg-body">
  <script>
    (function () {
      var match = document.cookie.match(/(?:^|;\s*)vp-theme=([^;]*)/);
      if (match && match[1] === 'dark') {
        document.body.classList.add('vp-dark-theme');
      }
    })();
  </script>
  <app-root class="d-flex flex-column flex-fill"></app-root>
</body>

</html>
