<dp-loading-spinner *ngIf="isLoading"></dp-loading-spinner>

<p class="text-muted text-center" *ngIf="!isLoading && rows.length === 0">
    No log entries for this {{ recordLabel }}.
</p>

<vp-table *ngIf="rows.length > 0"
          [columns]="columns"
          [data]="rows" />

<ng-template #descriptionCell let-rowData="rowData">
    <div style="white-space: pre-wrap;">{{ rowData?.description }}</div>
</ng-template>
